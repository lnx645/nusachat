# NusaChat CI — validasi tiap push/PR ke main.
#
# Tiga gerbang independen (gagal satu = merah):
#   backend  : php -l, migrate --fresh + seed SQLite, REST + WS smoke test
#   realtime : kompilasi Erlang/OTP (rebar3)
#   android  : assembleDebug
#
# Catatan deploy: workflow ini hanya validasi. Deploy butuh infra + secret
# prod (APP_SECRET 32+ byte, APP_ENV=production, MySQL, wss://, FCM service
# account, keystore Android) yang belum didefinisikan — jangan auto-deploy
# sebelum itu ada.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Izin minimal: baca kode + tulis artifact. Tanpa ini token bawaan
# mengikuti default repo yang bisa lebih longgar.
permissions:
  contents: read
  actions: write

jobs:
  backend:
    name: Backend (lint + migrate + REST smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Lint semua file PHP
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || fail=1
          done < <(find application tools index.php router.php -name '*.php' -print0)
          exit $fail

      - name: Migrate fresh + seed (SQLite)
        run: |
          cp .env.example .env
          # Dummy agar endpoint Google mencapai validasi token
          # (contoh .env mengosongkannya → smoke mengharap 401, bukan 503).
          sed -i 's/^GOOGLE_CLIENT_IDS=.*/GOOGLE_CLIENT_IDS=ci-test.apps.googleusercontent.com/' .env
          php tools/migrate.php --fresh
          php tools/seed.php

      - name: Jalankan API
        run: |
          php -S 127.0.0.1:8080 router.php > /tmp/nusachat-api.log 2>&1 &
          echo $! > /tmp/nusachat-api.pid
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null && break
            sleep 1
          done
          (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null || { echo "port 8080 tidak menyala"; exit 1; }

      - name: Smoke test REST
        run: python3 tools/smoke.py

      - name: Log server saat gagal
        if: failure()
        run: tail -n 60 /tmp/nusachat-api.log || true

      - name: Hentikan server
        if: always()
        run: kill "$(cat /tmp/nusachat-api.pid)" 2>/dev/null || true

  realtime-e2e:
    name: Realtime E2E (MySQL + Erlang + WS smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: nusachat
      DB_USER: root
      DB_PASS: root
      REALTIME_PORT: 8091
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nusachat
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Setup Erlang/OTP + rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3.24"

      - name: Cache rebar3 deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            realtime/nusachat_realtime/_build
          key: ${{ runner.os }}-otp27-rebar-${{ hashFiles('realtime/nusachat_realtime/rebar.lock') }}

      - name: Migrate fresh + seed (MySQL)
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i 's/^GOOGLE_CLIENT_IDS=.*/GOOGLE_CLIENT_IDS=ci-test.apps.googleusercontent.com/' .env
          php tools/migrate.php --fresh
          php tools/seed.php

      - name: Build Erlang gateway
        working-directory: realtime/nusachat_realtime
        run: rebar3 compile

      - name: Jalankan API + Erlang gateway
        run: |
          cd backend
          php -S 127.0.0.1:8080 router.php > /tmp/nusachat-api.log 2>&1 &
          echo $! > /tmp/nusachat-api.pid
          cd ../realtime/nusachat_realtime
          APP_SECRET=dev-secret-change-me-please-32-bytes-min \
            erl -noshell -pa _build/default/lib/*/ebin \
            -eval 'application:ensure_all_started(nusachat_realtime), receive after infinity -> ok end.' \
            > /tmp/nusachat-erl.log 2>&1 &
          echo $! > /tmp/nusachat-erl.pid
          for port in 8080 8091; do
            for i in $(seq 1 60); do
              (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null && break
              sleep 1
            done
            (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null || { echo "port $port tidak menyala"; exit 1; }
          done

      - name: Smoke test WebSocket (Erlang)
        working-directory: backend
        run: python3 tools/ws_smoke.py http://127.0.0.1:8080/api/v1 ws://127.0.0.1:8091

      - name: Log server saat gagal
        if: failure()
        run: |
          echo "===== api ====="; tail -n 40 /tmp/nusachat-api.log || true
          echo "===== erlang ====="; tail -n 40 /tmp/nusachat-erl.log || true

      - name: Hentikan server
        if: always()
        run: |
          kill "$(cat /tmp/nusachat-api.pid)" 2>/dev/null || true
          kill "$(cat /tmp/nusachat-erl.pid)" 2>/dev/null || true

  realtime:
    name: Realtime gateway (compile + eunit + dialyzer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: realtime/nusachat_realtime
    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP + rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3.24"

      - name: Cache rebar3 deps + dialyzer PLT
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            realtime/nusachat_realtime/_build
          key: ${{ runner.os }}-otp27-rebar-${{ hashFiles('realtime/nusachat_realtime/rebar.lock') }}

      - name: Compile
        run: rebar3 compile

      - name: Unit tests
        run: rebar3 eunit

      - name: Dialyzer
        run: rebar3 dialyzer

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu sudah membawa Android SDK (ANDROID_HOME terisi);
      # tinggal pastikan platform + build-tools API 35 ada.
      - name: Ensure Android SDK packages
        run: |
          MANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          yes | "$MANAGER" --licenses > /dev/null

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
