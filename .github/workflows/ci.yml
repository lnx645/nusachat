# NusaChat CI — validasi tiap push/PR ke main.
#
# Tiga gerbang independen (gagal satu = merah):
#   backend  : php -l, migrate --fresh + seed SQLite, REST + WS smoke test
#   realtime : kompilasi Erlang/OTP (rebar3)
#   android  : assembleDebug
#
# Catatan deploy: workflow ini hanya validasi. Deploy butuh infra + secret
# prod (APP_SECRET 32+ byte, APP_ENV=production, MySQL, wss://, FCM service
# account, keystore Android) yang belum didefinisikan — jangan auto-deploy
# sebelum itu ada.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + migrate + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Lint semua file PHP
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || fail=1
          done < <(find application tools index.php router.php -name '*.php' -print0)
          exit $fail

      - name: Migrate fresh + seed (SQLite)
        run: |
          cp .env.example .env
          # Dummy agar endpoint Google mencapai validasi token
          # (contoh .env mengosongkannya → smoke mengharap 401, bukan 503).
          sed -i 's/^GOOGLE_CLIENT_IDS=.*/GOOGLE_CLIENT_IDS=ci-test.apps.googleusercontent.com/' .env
          php tools/migrate.php --fresh
          php tools/seed.php

      - name: Jalankan API + WS gateway
        run: |
          php -S 127.0.0.1:8080 router.php > /tmp/nusachat-api.log 2>&1 &
          echo $! > /tmp/nusachat-api.pid
          php tools/ws-server.php > /tmp/nusachat-ws.log 2>&1 &
          echo $! > /tmp/nusachat-ws.pid
          for port in 8080 8090; do
            for i in $(seq 1 30); do
              (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null && break
              sleep 1
            done
            (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null || { echo "port $port tidak menyala"; exit 1; }
          done

      - name: Smoke test REST
        run: python3 tools/smoke.py

      - name: Smoke test WebSocket
        run: python3 tools/ws_smoke.py

      - name: Log server saat gagal
        if: failure()
        run: |
          echo "===== api ====="; tail -n 60 /tmp/nusachat-api.log || true
          echo "===== ws ====="; tail -n 60 /tmp/nusachat-ws.log || true

      - name: Hentikan server
        if: always()
        run: |
          kill "$(cat /tmp/nusachat-api.pid)" 2>/dev/null || true
          kill "$(cat /tmp/nusachat-ws.pid)" 2>/dev/null || true

  realtime:
    name: Realtime gateway (rebar3 compile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: realtime/nusachat_realtime
    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP + rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3.24"

      - name: Compile
        run: rebar3 compile

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
